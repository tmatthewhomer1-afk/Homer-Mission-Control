name: Refresh Mission Control Headlines

on:
  schedule:
    - cron: '15 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch headline feeds
        shell: python
        run: |
          from urllib.request import Request, urlopen
          from urllib.parse import quote
          from email.utils import parsedate_to_datetime
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import json, hashlib, datetime

          feeds = {
              'Top': 'https://news.google.com/rss?hl=en-US&gl=US&ceid=US:en',
              'Texas': 'https://news.google.com/rss/search?q=' + quote('Texas') + '&hl=en-US&gl=US&ceid=US:en',
              'Politics': 'https://news.google.com/rss/search?q=' + quote('US politics government') + '&hl=en-US&gl=US&ceid=US:en',
              'Higher Ed': 'https://news.google.com/rss/search?q=' + quote('higher education colleges universities') + '&hl=en-US&gl=US&ceid=US:en',
              'AI / Tech': 'https://news.google.com/rss/search?q=' + quote('artificial intelligence technology') + '&hl=en-US&gl=US&ceid=US:en',
          }

          def fetch(url):
              req=Request(url, headers={'User-Agent':'Mozilla/5.0 HomerMissionControl/1.0'})
              with urlopen(req, timeout=25) as r:
                  return r.read()

          def parse(data):
              root=ET.fromstring(data)
              out=[]
              for item in root.findall('./channel/item')[:15]:
                  title=(item.findtext('title') or '').strip()
                  link=(item.findtext('link') or '').strip()
                  pub=(item.findtext('pubDate') or '').strip()
                  source_el=item.find('source')
                  source=(source_el.text or '').strip() if source_el is not None else ''
                  if not title or not link: continue
                  try: published=parsedate_to_datetime(pub).isoformat()
                  except Exception: published=pub
                  ident=hashlib.sha1((title+'|'+link).encode()).hexdigest()[:16]
                  out.append({'id':ident,'title':title,'url':link,'source':source,'published':published})
              return out

          categories={}
          for name,url in feeds.items():
              try: categories[name]=parse(fetch(url))
              except Exception as e:
                  print(f'{name}: {e}')
                  categories[name]=[]

          payload={'updatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'categories':categories}
          Path('data').mkdir(exist_ok=True)
          Path('data/headlines.json').write_text(json.dumps(payload,indent=2,ensure_ascii=False),encoding='utf-8')

      - name: Commit refreshed headlines
        shell: bash
        run: |
          if git diff --quiet -- data/headlines.json; then
            echo 'No headline changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/headlines.json
          git commit -m 'Refresh daily headlines'
          git push
