name: Wire V3.7 live briefing

on:
  push:
    branches: [feature/v3.7-live-briefing]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire V3.7 assets
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          changed=False
          if '<link rel="stylesheet" href="v37.css">' not in text:
              text=text.replace('</head>','<link rel="stylesheet" href="v37.css">\n</head>',1); changed=True
          if '<script src="v37.js"></script>' not in text:
              text=text.replace('</body>','<script src="v37.js"></script>\n</body>',1); changed=True
          if 'Homer Mission Control V3.6' in text:
              text=text.replace('Homer Mission Control V3.6','Homer Mission Control V3.7',1); changed=True
          p.write_text(text,encoding='utf-8')
          Path('.v37patched').write_text('yes' if changed else 'no')
      - name: Commit wiring
        shell: bash
        run: |
          if [ "$(cat .v37patched)" = "yes" ]; then
            rm .v37patched
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Wire V3.7 live briefing into dashboard'
            git push
          else
            rm .v37patched
          fi
