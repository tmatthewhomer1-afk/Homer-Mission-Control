name: Fix Mission Control migration typo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fix academic calendar typo if present
        shell: bash
        run: |
          if grep -q 'ACAMIC_CALENDAR' index.html; then
            sed -i 's/ACAMIC_CALENDAR/ACADEMIC_CALENDAR/g' index.html
            echo 'changed=true' >> "$GITHUB_ENV"
          else
            echo 'changed=false' >> "$GITHUB_ENV"
          fi

      - name: Commit correction
        if: env.changed == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix academic calendar reference'
          git push
