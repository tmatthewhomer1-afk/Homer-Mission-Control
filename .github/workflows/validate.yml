name: Validate Mission Control

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check v36.js
          node --check v37.js
      - name: Verify V3.7 assets are wired
        shell: bash
        run: |
          grep -q 'href="v36.css"' index.html
          grep -q 'src="v36.js"' index.html
          grep -q 'href="v37.css"' index.html
          grep -q 'src="v37.js"' index.html
          grep -q 'Homer Mission Control V3.7' index.html
          test -f data/headlines.json
          test -f .github/workflows/update-headlines.yml
