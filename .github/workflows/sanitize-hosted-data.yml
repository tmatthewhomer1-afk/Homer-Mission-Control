name: Remove private default task data

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove embedded default task data
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          updated, count = re.subn(r'const DEFAULT_TASKS = \[.*?\];', 'const DEFAULT_TASKS = [];', text, count=1, flags=re.S)
          if count:
              p.write_text(updated, encoding='utf-8')
              Path('.sanitized').write_text('yes', encoding='utf-8')
      - name: Commit sanitized hosted version
        shell: bash
        run: |
          if [ -f .sanitized ]; then
            rm .sanitized
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Remove embedded private task data from hosted app'
            git push
          fi
